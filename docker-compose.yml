# Osprey self-host one-liner:  docker compose up
# Postgres+pgvector + Redis + API + background worker.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: osprey
      POSTGRES_PASSWORD: osprey
      POSTGRES_DB: osprey
      # Consumed by the init script below when it creates the app role.
      OSPREY_APP_DB_PASSWORD: ${OSPREY_APP_DB_PASSWORD:-osprey_app}
    ports: ["5432:5432"]
    volumes:
      - osprey_pgdata:/var/lib/postgresql/data
      # Creates the non-superuser "osprey_app" role on first start, so row-level
      # security can actually enforce (a superuser connection bypasses it).
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U osprey"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    # Migrations run as the schema OWNER (they create/alter tables); the app then
    # serves as the ordinary role, which is what makes row-level security bite.
    command: >
      sh -c "OSPREY_DATABASE_URL=$$OSPREY_MIGRATION_DATABASE_URL alembic upgrade head &&
             uvicorn osprey.main:app --host 0.0.0.0 --port 8000"
    environment:
      OSPREY_ENV: prod
      OSPREY_DATABASE_URL: postgresql+asyncpg://osprey_app:${OSPREY_APP_DB_PASSWORD:-osprey_app}@db:5432/osprey
      OSPREY_MIGRATION_DATABASE_URL: postgresql+asyncpg://osprey:osprey@db:5432/osprey
      OSPREY_REDIS_URL: redis://redis:6379/0
      OSPREY_SECRET_KEY: ${OSPREY_SECRET_KEY:?set OSPREY_SECRET_KEY in .env}
      OSPREY_ENCRYPTION_KEY: ${OSPREY_ENCRYPTION_KEY:?set OSPREY_ENCRYPTION_KEY in .env}
      OSPREY_AI_PROVIDER: ${OSPREY_AI_PROVIDER:-deterministic}
      OSPREY_ANTHROPIC_API_KEY: ${OSPREY_ANTHROPIC_API_KEY:-}
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

  worker:
    build: ./backend
    command: arq osprey.workers.main.WorkerSettings
    environment:
      OSPREY_ENV: prod
      OSPREY_DATABASE_URL: postgresql+asyncpg://osprey_app:${OSPREY_APP_DB_PASSWORD:-osprey_app}@db:5432/osprey
      OSPREY_REDIS_URL: redis://redis:6379/0
      OSPREY_SECRET_KEY: ${OSPREY_SECRET_KEY:?set OSPREY_SECRET_KEY in .env}
      OSPREY_ENCRYPTION_KEY: ${OSPREY_ENCRYPTION_KEY:?set OSPREY_ENCRYPTION_KEY in .env}
      OSPREY_AI_PROVIDER: ${OSPREY_AI_PROVIDER:-deterministic}
      OSPREY_ANTHROPIC_API_KEY: ${OSPREY_ANTHROPIC_API_KEY:-}
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

volumes:
  osprey_pgdata:
