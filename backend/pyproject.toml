[build-system]
# >=78.1.1 clears PYSEC-2022-43012 / PYSEC-2025-49 / PYSEC-2026-1918; >=83 also
# clears PYSEC-2026-3447. Keep this current — pip-audit gates on it in CI.
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "osprey-core"
version = "0.1.0"
description = "Osprey — the foreman that never sleeps. Open-source construction/RE hotlist agent (backend brain)."
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "Osprey contributors" }]
# Floors reflect the versions the suite is actually green on (see constraints.txt).
# Upper caps are set only where the next major is a known breaking boundary, so a
# surprise major can't silently enter CI; raise them deliberately with a test run.
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.24",
    "sqlalchemy>=2.0.36,<3.0",
    "aiosqlite>=0.20",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "PyJWT>=2.9,<3.0",
    "cryptography>=43.0,<50.0",
    "httpx>=0.28,<1.0",
    "tenacity>=9.0,<10.0",
    "openpyxl>=3.1.5",
    "reportlab>=4.2,<6.0",
    "python-multipart>=0.0.18",
]

[project.scripts]
osprey-seed = "osprey.seed:main"

[project.optional-dependencies]
# Production extras — not needed to run the test suite.
prod = [
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "arq>=0.26",
    "redis>=5.0",
    "alembic>=1.13",
]
ai = [
    "anthropic>=0.34",
    "ollama>=0.3",
    "openai>=1.40",
]
push = [
    "pywebpush>=1.14",
]
otel = [
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.22",
    "ruff>=0.6,<1.0",
    "mypy>=1.13",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["osprey*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Scoped, not blanket: new deprecations must stay visible so upstream breakage is
# caught before it becomes an error. Add a narrow entry (with a reason) per warning.
filterwarnings = [
    "default::DeprecationWarning",
    # PyJWT warns on the short HMAC keys used by the offline test fixtures.
    "ignore:.*HMAC key.*:UserWarning",
]

[tool.coverage.run]
source = ["osprey"]
branch = true
omit = ["osprey/workers/main.py"]   # arq CLI entrypoint; exercised via workers/tasks.py

[tool.coverage.report]
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
# B008: FastAPI Depends() in defaults is idiomatic. UP042: str+Enum is the standard
# pattern for SQLModel/pydantic-backed enums. E501: line length handled by formatter.
ignore = ["B008", "E501", "UP042"]

[tool.ruff.lint.per-file-ignores]
"osprey/connectors/base.py" = ["B027"]  # abstract async-generator sentinel yields

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = false
# SQLModel exposes table columns as their Python types (int/str/datetime), so mypy
# cannot see the SQLAlchemy ColumnElement and false-flags `.desc()/.in_()/where()`
# on every query. These two codes are pure ORM-expression noise for SQLModel; the
# runtime behaviour is verified by the test suite. Genuine type errors surface via
# the other codes, which remain enabled.
disable_error_code = ["attr-defined", "arg-type", "call-overload"]
