[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "osprey-core"
version = "0.1.0"
description = "Osprey — the foreman that never sleeps. Open-source construction/RE hotlist agent (backend brain)."
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "Osprey contributors" }]
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.21",
    "sqlalchemy>=2.0.30",
    "aiosqlite>=0.20",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "PyJWT>=2.8",
    "cryptography>=42.0",
    "httpx>=0.27",
    "tenacity>=8.4",
    "openpyxl>=3.1",
    "reportlab>=4.2",
    "python-multipart>=0.0.9",
]

[project.scripts]
osprey-seed = "osprey.seed:main"

[project.optional-dependencies]
# Production extras — not needed to run the test suite.
prod = [
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "arq>=0.26",
    "redis>=5.0",
    "alembic>=1.13",
]
ai = [
    "anthropic>=0.34",
    "ollama>=0.3",
    "openai>=1.40",
]
push = [
    "pywebpush>=1.14",
]
otel = [
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-python-jose",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["osprey*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
# B008: FastAPI Depends() in defaults is idiomatic. UP042: str+Enum is the standard
# pattern for SQLModel/pydantic-backed enums. E501: line length handled by formatter.
ignore = ["B008", "E501", "UP042"]

[tool.ruff.lint.per-file-ignores]
"osprey/connectors/base.py" = ["B027"]  # abstract async-generator sentinel yields

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = false
# SQLModel exposes table columns as their Python types (int/str/datetime), so mypy
# cannot see the SQLAlchemy ColumnElement and false-flags `.desc()/.in_()/where()`
# on every query. These two codes are pure ORM-expression noise for SQLModel; the
# runtime behaviour is verified by the test suite. Genuine type errors surface via
# the other codes, which remain enabled.
disable_error_code = ["attr-defined", "arg-type", "call-overload"]
