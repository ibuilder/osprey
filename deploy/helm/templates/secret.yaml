apiVersion: v1
kind: Secret
metadata:
  name: {{ include "osprey.fullname" . }}
  labels: {{- include "osprey.labels" . | nindent 4 }}
  annotations:
    # The migration Job is a pre-install/pre-upgrade hook, and hooks run before the
    # release's normal resources exist. Without these annotations the Job starts
    # before this Secret is created and dies with CreateContainerConfigError. A
    # lower hook-weight than the Job (-10 vs -5) guarantees the ordering, and
    # before-hook-creation (rather than hook-succeeded) keeps the Secret in place
    # afterwards for the api/worker Deployments.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  secretKey: {{ .Values.secrets.secretKey | quote }}
  encryptionKey: {{ .Values.secrets.encryptionKey | quote }}
  webhookHmacSecret: {{ .Values.secrets.webhookHmacSecret | quote }}
  databaseUrl: {{ .Values.secrets.databaseUrl | quote }}
  # Falls back to databaseUrl so a single-role setup still installs; production
  # should set this to the schema owner.
  migrationDatabaseUrl: {{ .Values.secrets.migrationDatabaseUrl | default .Values.secrets.databaseUrl | quote }}
  redisUrl: {{ .Values.secrets.redisUrl | quote }}
  anthropicApiKey: {{ .Values.secrets.anthropicApiKey | quote }}
