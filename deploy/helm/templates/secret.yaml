apiVersion: v1
kind: Secret
metadata:
  name: {{ include "osprey.fullname" . }}
  labels: {{- include "osprey.labels" . | nindent 4 }}
type: Opaque
stringData:
  secretKey: {{ .Values.secrets.secretKey | quote }}
  encryptionKey: {{ .Values.secrets.encryptionKey | quote }}
  webhookHmacSecret: {{ .Values.secrets.webhookHmacSecret | quote }}
  databaseUrl: {{ .Values.secrets.databaseUrl | quote }}
  # Falls back to databaseUrl so a single-role setup still installs; production
  # should set this to the schema owner.
  migrationDatabaseUrl: {{ .Values.secrets.migrationDatabaseUrl | default .Values.secrets.databaseUrl | quote }}
  redisUrl: {{ .Values.secrets.redisUrl | quote }}
  anthropicApiKey: {{ .Values.secrets.anthropicApiKey | quote }}
