apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "osprey.fullname" . }}-worker
  labels: {{- include "osprey.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount.worker }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "osprey.name" . }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "osprey.name" . }}
        app.kubernetes.io/component: worker
    spec:
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["arq", "osprey.workers.main.WorkerSettings"]
          env: {{- include "osprey.env" . | nindent 12 }}
          resources: {{- toYaml .Values.resources.worker | nindent 12 }}
