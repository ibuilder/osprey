{{- if .Values.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "osprey.fullname" . }}-migrate
  labels: {{- include "osprey.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels: {{- include "osprey.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ .Values.serviceAccount.name | default (include "osprey.fullname" .) }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      volumes: {{- include "osprey.tmpVolume" . | nindent 8 }}
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["alembic", "upgrade", "head"]
          # The migration job holds the most privileged database credential in the
          # deployment, so it gets the same container hardening as everything else.
          securityContext: {{- include "osprey.containerSecurityContext" . | nindent 12 }}
          # Runs as the schema OWNER: migrations issue DDL, which the ordinary
          # runtime role deliberately cannot do.
          env:
            {{- include "osprey.env" . | nindent 12 }}
            {{- include "osprey.migrationDbEnv" . | nindent 12 }}
          volumeMounts: {{- include "osprey.tmpMount" . | nindent 12 }}
          resources: {{- toYaml .Values.resources.api | nindent 12 }}
{{- end }}
