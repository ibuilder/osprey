{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name | default (include "osprey.fullname" .) }}
  labels: {{- include "osprey.labels" . | nindent 4 }}
  annotations:
    # Same reasoning as the Secret: the migration Job is a pre-install/pre-upgrade
    # hook, and hooks run before the release's ordinary resources exist. A Job that
    # names a ServiceAccount which has not been created yet fails to schedule
    # ("error looking up service account"). The weight puts this ahead of the Job
    # (-10 vs -5), and before-hook-creation keeps it in place afterwards for the
    # api/worker Deployments, which reference the same account.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
# Osprey never calls the Kubernetes API. Projecting a token into the pod would
# hand a compromised process a cluster credential it has no legitimate use for.
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
