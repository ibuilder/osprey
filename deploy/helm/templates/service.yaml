apiVersion: v1
kind: Service
metadata:
  name: {{ include "osprey.fullname" . }}-api
  labels: {{- include "osprey.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "osprey.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api
  ports:
    # Named so the ServiceMonitor can select it by name rather than by number.
    - name: http
      port: {{ .Values.service.port }}
      targetPort: 8000
      protocol: TCP
