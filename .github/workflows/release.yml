name: Release

# Tag a version (e.g. v0.1.0) to build signed desktop bundles + the backend image.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      unsigned:
        description: >
          Build without updater artifacts, for when the updater signing key is
          not available. The result CANNOT update itself — never tag from it.
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

jobs:
  # ---- Signed Tauri desktop bundles (win / mac / linux) -------------------- #
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: "--target aarch64-apple-darwin"
          # macos-latest is Apple silicon, and PyInstaller cannot cross-freeze, so
          # the Intel bundle needs a genuinely Intel runner. Built on macos-latest
          # this job could only ever fail — which it silently did, hidden behind an
          # earlier codesign failure, for every release since the backend became a
          # bundled sidecar.
          #
          # Must be one of the *-intel labels: macos-13 was retired, and an unknown
          # label does not fail the job, it queues forever waiting for a runner that
          # will never exist.
          - os: macos-15-intel
            args: "--target x86_64-apple-darwin"
          - os: ubuntu-22.04
            args: ""
          - os: windows-latest
            args: ""
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: clients/desktop
    steps:
      - uses: actions/checkout@v7

      - name: Linux build deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ contains(matrix.args, 'aarch64-apple') && 'aarch64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: clients/desktop/src-tauri

      - run: npm ci

      # Windows Authenticode via SignPath Foundation (see docs/code-signing.md).
      #
      # Off until the repository has SIGNPATH_API_TOKEN and SIGNPATH_ORGANIZATION_ID,
      # so this workflow keeps producing releases exactly as before in the meantime.
      # Only tag releases are submitted: every signing request waits for a human to
      # approve it in SignPath, and a dry run must not page the approver.
      - name: Decide whether SignPath signing applies
        id: signpath
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          ORG: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
          UNSIGNED: ${{ inputs.unsigned == true }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ] || [ -z "${ORG:-}" ]; then
            echo "::notice::SignPath is not configured; Windows binaries ship without Authenticode."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          elif [ "$IS_TAG" != "true" ] || [ "$UNSIGNED" = "true" ]; then
            echo "::notice::SignPath skipped: only tag releases are submitted for signing."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "SignPath signing enabled for this release."
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      # Freeze the backend and bundle it as a Tauri resource, so the installer needs
      # no Python and no Docker on the user's machine. This is a PyInstaller directory
      # build, not a single self-extracting binary — see packaging/osprey-backend.spec
      # for why (antivirus false positives and cold-start cost).
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build the backend sidecar
        shell: bash
        working-directory: backend
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -c constraints.txt -e . pyinstaller
          pyinstaller packaging/osprey-backend.spec --noconfirm \
            --distpath dist-sidecar --workpath build-sidecar
          # PyInstaller cannot cross-freeze, and the macOS matrix cross-builds x86_64
          # on an arm64 runner. Fail loudly here rather than shipping a bundle whose
          # backend cannot run on the target it was built for.
          TARGET="${MATRIX_ARGS#--target }"
          TRIPLE="${TARGET:-$(rustc -vV | sed -n 's/^host: //p')}"
          HOST=$(rustc -vV | sed -n 's/^host: //p')
          if [ "$TRIPLE" != "$HOST" ]; then
            echo "::error::cannot freeze the backend for $TRIPLE on a $HOST runner —" \
                 "PyInstaller does not cross-compile. Build this target on its own runner."
            exit 1
          fi
          DEST=../clients/desktop/src-tauri/binaries/osprey-backend
          rm -rf "$DEST"
          mkdir -p "$(dirname "$DEST")"
          cp -R dist-sidecar/osprey-backend "$DEST"
          # The bundle is worthless without the executable, and a resource that is
          # merely missing produces a confusing runtime error instead of a build one.
          test -x "$DEST/osprey-backend" || test -f "$DEST/osprey-backend.exe" || {
            echo "::error::PyInstaller produced no osprey-backend executable in $DEST"
            exit 1
          }
          du -sh "$DEST"
        env:
          MATRIX_ARGS: ${{ matrix.args }}

      # Sign the backend before Tauri bundles it. Signing only the installer would
      # leave osprey-backend.exe unsigned inside it, and that executable is what
      # antivirus inspects when the app spawns it. Only the executable is uploaded:
      # the rest of the PyInstaller directory is third-party runtime, which SignPath
      # Foundation does not sign on this project's behalf.
      - name: Stage the backend executable for signing
        id: backend-artifact
        if: steps.signpath.outputs.enabled == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-backend-exe
          path: clients/desktop/src-tauri/binaries/osprey-backend/osprey-backend.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign the backend executable (SignPath)
        if: steps.signpath.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'osprey' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: backend
          github-artifact-id: ${{ steps.backend-artifact.outputs.artifact-id }}
          wait-for-completion: true
          # Approval is manual, so allow for a human to get to it.
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: clients/desktop/src-tauri/binaries/osprey-backend

      - name: The backend executable carries a valid signature
        if: steps.signpath.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature src-tauri/binaries/osprey-backend/osprey-backend.exe
          if ($sig.Status -ne 'Valid') {
            Write-Error "osprey-backend.exe signature is $($sig.Status): $($sig.StatusMessage)"
            exit 1
          }
          Write-Output "Signed by: $($sig.SignerCertificate.Subject)"

      # Decide whether Apple signing can actually work, BEFORE committing the build
      # to it. A malformed or wrong-password APPLE_CERTIFICATE makes tauri-action
      # abort with "failed to import keychain certificate", which took out both
      # macOS jobs for the whole v0.2.1 release — the release still published from
      # the jobs that passed, so it shipped with no macOS artifacts and nothing
      # said so. An unsigned macOS build is a worse artifact than a signed one;
      # no macOS artifact at all is worse than both.
      - name: Probe the Apple signing certificate
        id: apple
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -uo pipefail
          disable() {
            echo "::warning::$1 — building macOS UNSIGNED. Users will see Gatekeeper's" \
                 "'unidentified developer' prompt. Fix or delete the APPLE_CERTIFICATE secret."
            echo "signing=false" >> "$GITHUB_OUTPUT"
            exit 0
          }
          [ -n "${APPLE_CERTIFICATE:-}" ] || disable "no APPLE_CERTIFICATE secret is set"

          tmp=$(mktemp -d)
          # openssl rather than base64(1): the decode flag is spelled --decode on GNU
          # and -D on BSD/macOS, and guessing wrong here would report a perfectly good
          # certificate as malformed and quietly ship unsigned.
          printf '%s' "$APPLE_CERTIFICATE" | openssl base64 -d -A > "$tmp/cert.p12" 2>/dev/null \
            || disable "APPLE_CERTIFICATE is not valid base64"
          [ -s "$tmp/cert.p12" ] || disable "APPLE_CERTIFICATE decodes to an empty file"

          # Import into a throwaway keychain: the same operation tauri-action does,
          # so this either proves it works or explains why it will not.
          kc="$tmp/probe.keychain-db"
          security create-keychain -p probe-password "$kc" >/dev/null 2>&1 \
            || disable "could not create a probe keychain"
          # A locked keychain would fail the import for a reason that has nothing to
          # do with the certificate, and this probe must not produce false negatives:
          # wrongly reporting a good certificate as bad would silently ship unsigned.
          security unlock-keychain -p probe-password "$kc" >/dev/null 2>&1 \
            || disable "could not unlock the probe keychain"
          if security import "$tmp/cert.p12" -k "$kc" -P "${APPLE_CERTIFICATE_PASSWORD:-}" \
               -T /usr/bin/codesign >/dev/null 2>&1; then
            echo "Apple certificate imported cleanly; signing enabled."
            echo "signing=true" >> "$GITHUB_OUTPUT"
            # Export the Apple variables into the job environment ONLY here.
            #
            # They cannot be gated in the build step's `env:` block: an expression
            # yielding '' still DEFINES the variable, and the Tauri bundler checks
            # whether APPLE_CERTIFICATE exists rather than whether it is non-empty.
            # An empty-but-defined variable therefore still triggers `security
            # import`, which then fails on nothing — the exact failure this step
            # was written to prevent. Writing them here means that when signing is
            # off, they are genuinely absent.
            for var in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                       APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              value=$(printenv "$var" || true)
              [ -n "$value" ] || continue
              printf '%s<<OSPREY_EOF\n%s\nOSPREY_EOF\n' "$var" "$value" >> "$GITHUB_ENV"
            done
          else
            security delete-keychain "$kc" >/dev/null 2>&1 || true
            disable "APPLE_CERTIFICATE could not be imported (bad PKCS#12, or APPLE_CERTIFICATE_PASSWORD is wrong)"
          fi
          security delete-keychain "$kc" >/dev/null 2>&1 || true
          rm -rf "$tmp"

      # tauri.conf.json ships a committed updater public key and sets
      # `createUpdaterArtifacts`, so the bundler goes looking for the private half
      # on every build. Without this check a missing secret surfaces as an opaque
      # failure deep inside the bundler, twenty minutes in, on every matrix leg at
      # once. Worse is the case where it does not fail: an installed app verifies
      # updates against the compiled-in public key, so a release whose payload was
      # signed with anything else is an app that can never update again — and the
      # only symptom is silence.
      - name: The updater signing key is present
        if: inputs.unsigned != true
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${KEY:-}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set on this repository."
            echo "The app ships an updater public key, so every release must be signed"
            echo "with its private half or installed copies can never update."
            echo "Add it under Settings > Secrets and variables > Actions,"
            echo "or re-run this workflow with the 'unsigned' input to build a preview."
            exit 1
          fi
          echo "Updater signing key present."

      - name: Build + sign + release
        if: inputs.unsigned != true
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri updater signing (generate: `npm run tauri signer generate`).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # No APPLE_* entries here on purpose. The probe step exports them into the
          # job environment only when the certificate actually imports; listing them
          # here with a conditional expression would define them as empty strings,
          # and an empty-but-defined APPLE_CERTIFICATE still sends the bundler down
          # the codesign path.
        with:
          projectPath: clients/desktop
          # Publish only on a tag push. Without this guard a manual workflow_dispatch
          # would create a draft release named after the branch ("Osprey main"), so
          # there was no way to exercise this workflow without polluting Releases —
          # which is precisely why nothing here has ever been verified before a tag.
          # With it, workflow_dispatch is a genuine dry run: it builds everything,
          # signs nothing, publishes nothing.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('Osprey {0}', github.ref_name) || '' }}
          releaseDraft: true
          releaseBody: |
            **Code signing.** If SignPath signing is configured for this release, the
            Windows installers are Authenticode-signed and their Properties -> Digital
            Signatures tab shows SignPath Foundation. Otherwise, and on macOS without
            an Apple certificate, SmartScreen and Gatekeeper will warn on first run. See
            [docs/code-signing.md](https://github.com/ibuilder/osprey/blob/main/docs/code-signing.md)
            for where that stands.

            Until then the hash is the check that matters: verify your download
            against `SHA256SUMS.txt`, attached to this release.

            Update payloads *are* signed — an installed copy verifies every update
            against the public key compiled into it and discards anything else.

            Every file here also carries signed build provenance. Confirm one was
            built by this workflow from this commit:

                gh attestation verify <file> --repo ibuilder/osprey
          args: ${{ matrix.args }}

      # Authenticode for the installers, after tauri-action has built and uploaded
      # them to the draft release.
      #
      # Order is everything here. Signing rewrites the installer bytes, and the
      # updater signature tauri-action already computed covers the unsigned bytes.
      # So: sign, then recompute each updater .sig over the signed file, then
      # replace both on the draft. latest.json still holds the old signatures at
      # that point; release-integrity brings it in line once every matrix leg has
      # finished, so no other leg can overwrite the fix.
      - name: Stage the installers for signing
        id: installer-artifact
        if: steps.signpath.outputs.enabled == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-windows-installers
          path: |
            clients/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            clients/desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 1

      - name: Sign the installers (SignPath)
        if: steps.signpath.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'osprey' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: installers
          github-artifact-id: ${{ steps.installer-artifact.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: clients/desktop/src-tauri/target/release/bundle

      - name: Re-sign updater payloads over the signed installers, and publish them
        if: steps.signpath.outputs.enabled == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(
            Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe
            Get-ChildItem src-tauri/target/release/bundle/msi/*.msi
          )
          if ($installers.Count -ne 2) {
            Write-Error "expected one NSIS and one MSI installer, found $($installers.Count)"
            exit 1
          }
          foreach ($file in $installers) {
            $sig = Get-AuthenticodeSignature $file.FullName
            if ($sig.Status -ne 'Valid') {
              Write-Error "$($file.Name) signature is $($sig.Status): $($sig.StatusMessage)"
              exit 1
            }
            Write-Output "$($file.Name) signed by: $($sig.SignerCertificate.Subject)"
            # Replace the stale .sig tauri-action wrote over the unsigned bytes.
            Remove-Item -ErrorAction SilentlyContinue "$($file.FullName).sig"
            npm run tauri signer sign -- "$($file.FullName)"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if (-not (Test-Path "$($file.FullName).sig")) {
              Write-Error "no updater signature written for $($file.Name)"
              exit 1
            }
            gh release upload $env:TAG $file.FullName "$($file.FullName).sig" --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      # A second, deliberately separate path. Two steps rather than one with
      # conditional inputs, because the failure this guards against is shipping an
      # unsigned build believing it was signed — and a single step whose behaviour
      # flips on an expression is exactly how that happens. This one publishes
      # nothing and is labelled in the log.
      - name: Build unsigned preview (no updater payload)
        if: inputs.unsigned == true
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: clients/desktop
          tagName: ""
          releaseName: ""
          args: ${{ matrix.args }}

  # ---- Checksums, SBOM and signed provenance ------------------------------- #
  # The release notes tell people to verify their download, and until this job
  # existed they pointed at a SHA256SUMS.txt that was never published. For an
  # unsigned build the hash is the only integrity check a downloader has.
  #
  # Provenance goes further: a signed statement, recorded in a public transparency
  # log, that these bytes came from this workflow at this commit. It does not
  # replace code signing — the OS does not consult it — but anyone can check it
  # with `gh attestation verify`, and it needs no secret at all: it is signed with
  # the workflow's own OIDC identity.
  release-integrity:
    name: Publish checksums and provenance
    needs: desktop
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write     # upload the assets
      id-token: write     # mint the attestation signing identity
      attestations: write # record it
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Runs before anything is hashed or attested, so a release that is wrong
      # never gets a checksum file and an attestation vouching for it. The draft
      # stays unpublished, which is the whole point of publishing drafts.
      #
      # This is the check the releases page cannot give you: that each .sig was
      # made by the key this application actually trusts, not merely by a valid
      # one. A release signed with the wrong key produces installers that look
      # perfect and an installed base that can never update again.
      #
      # It also catches tag/version skew, which has already happened here: v0.2.0
      # shipped Osprey_0.1.0_* binaries because tauri.conf.json was not bumped
      # before tagging, and nothing noticed for months.
      # Runs first: the Windows leg re-signs installers after tauri-action wrote
      # latest.json, so the manifest must take the published signatures before
      # anything below checks, hashes or attests it.
      - name: Bring latest.json in line with the published signatures
        run: python scripts/sync_manifest_signatures.py "$TAG" --repo "$GITHUB_REPOSITORY"

      - name: Verify the release against the trusted key
        run: python scripts/verify_release.py "$TAG" --repo "$GITHUB_REPOSITORY"

      - name: Collect the release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          gh release download "$TAG" --dir assets --pattern '*'
          # Removed before hashing, never after: a re-run that hashed the previous
          # run's copies would publish a SHA256SUMS listing its own predecessor.
          for stale in SHA256SUMS.txt; do
            rm -f "assets/$stale"
          done
          ls -la assets

      - name: Hash everything
        shell: bash
        run: |
          set -euo pipefail
          (cd assets && sha256sum -- *) > SHA256SUMS.txt
          cat SHA256SUMS.txt
          listed=$(wc -l < SHA256SUMS.txt)
          present=$(find assets -maxdepth 1 -type f | wc -l)
          # A silent mismatch here is how a file ships unverifiable.
          [ "$listed" -eq "$present" ] || {
            echo "::error::hashed $listed files but $present are present"; exit 1; }

      - name: Upload checksums
        run: gh release upload "$TAG" SHA256SUMS.txt --clobber

      - name: Attest the installers
        uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: SHA256SUMS.txt

  # ---- Backend Docker image ------------------------------------------------ #
  backend-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # A release tags the image with the version and moves :latest. A dry run must
      # do neither — and cannot reuse github.ref_name, because branch names may
      # contain '/', which is not a legal Docker tag ("invalid reference format").
      - name: Decide image tags
        id: img
        shell: bash
        run: |
          set -euo pipefail
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER}/osprey"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            printf 'primary=%s:%s\n' "$repo" "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            printf 'tags<<EOF\n%s:%s\n%s:latest\nEOF\n' \
              "$repo" "$GITHUB_REF_NAME" "$repo" >> "$GITHUB_OUTPUT"
          else
            printf 'primary=%s:dryrun\n' "$repo" >> "$GITHUB_OUTPUT"
            printf 'tags=%s:dryrun\n' "$repo" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v7
        with:
          context: ./backend
          # Same guard as the desktop job. `push: true` on a manual dispatch would
          # publish ghcr.io/.../osprey:main AND overwrite :latest from an untagged
          # commit. On a dry run the image is loaded locally instead, so the SBOM
          # step below still has something real to scan.
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          load: ${{ !startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.img.outputs.tags }}
      - name: SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.img.outputs.primary }}
          format: spdx-json
          output-file: osprey-image-sbom.spdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: image-sbom
          path: osprey-image-sbom.spdx.json
