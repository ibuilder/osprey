name: Release

# Tag a version (e.g. v0.1.0) to build signed desktop bundles + the backend image.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  # ---- Signed Tauri desktop bundles (win / mac / linux) -------------------- #
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: "--target aarch64-apple-darwin"
          # macos-latest is Apple silicon, and PyInstaller cannot cross-freeze, so
          # the Intel bundle needs a genuinely Intel runner. Built on macos-latest
          # this job could only ever fail — which it silently did, hidden behind an
          # earlier codesign failure, for every release since the backend became a
          # bundled sidecar.
          #
          # Must be one of the *-intel labels: macos-13 was retired, and an unknown
          # label does not fail the job, it queues forever waiting for a runner that
          # will never exist.
          - os: macos-15-intel
            args: "--target x86_64-apple-darwin"
          - os: ubuntu-22.04
            args: ""
          - os: windows-latest
            args: ""
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: clients/desktop
    steps:
      - uses: actions/checkout@v7

      - name: Linux build deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ contains(matrix.args, 'aarch64-apple') && 'aarch64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: clients/desktop/src-tauri

      - run: npm ci

      # Freeze the backend and bundle it as a Tauri resource, so the installer needs
      # no Python and no Docker on the user's machine. This is a PyInstaller directory
      # build, not a single self-extracting binary — see packaging/osprey-backend.spec
      # for why (antivirus false positives and cold-start cost).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the backend sidecar
        shell: bash
        working-directory: backend
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -c constraints.txt -e . pyinstaller
          pyinstaller packaging/osprey-backend.spec --noconfirm \
            --distpath dist-sidecar --workpath build-sidecar
          # PyInstaller cannot cross-freeze, and the macOS matrix cross-builds x86_64
          # on an arm64 runner. Fail loudly here rather than shipping a bundle whose
          # backend cannot run on the target it was built for.
          TARGET="${MATRIX_ARGS#--target }"
          TRIPLE="${TARGET:-$(rustc -vV | sed -n 's/^host: //p')}"
          HOST=$(rustc -vV | sed -n 's/^host: //p')
          if [ "$TRIPLE" != "$HOST" ]; then
            echo "::error::cannot freeze the backend for $TRIPLE on a $HOST runner —" \
                 "PyInstaller does not cross-compile. Build this target on its own runner."
            exit 1
          fi
          DEST=../clients/desktop/src-tauri/binaries/osprey-backend
          rm -rf "$DEST"
          mkdir -p "$(dirname "$DEST")"
          cp -R dist-sidecar/osprey-backend "$DEST"
          # The bundle is worthless without the executable, and a resource that is
          # merely missing produces a confusing runtime error instead of a build one.
          test -x "$DEST/osprey-backend" || test -f "$DEST/osprey-backend.exe" || {
            echo "::error::PyInstaller produced no osprey-backend executable in $DEST"
            exit 1
          }
          du -sh "$DEST"
        env:
          MATRIX_ARGS: ${{ matrix.args }}

      # Decide whether Apple signing can actually work, BEFORE committing the build
      # to it. A malformed or wrong-password APPLE_CERTIFICATE makes tauri-action
      # abort with "failed to import keychain certificate", which took out both
      # macOS jobs for the whole v0.2.1 release — the release still published from
      # the jobs that passed, so it shipped with no macOS artifacts and nothing
      # said so. An unsigned macOS build is a worse artifact than a signed one;
      # no macOS artifact at all is worse than both.
      - name: Probe the Apple signing certificate
        id: apple
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -uo pipefail
          disable() {
            echo "::warning::$1 — building macOS UNSIGNED. Users will see Gatekeeper's" \
                 "'unidentified developer' prompt. Fix or delete the APPLE_CERTIFICATE secret."
            echo "signing=false" >> "$GITHUB_OUTPUT"
            exit 0
          }
          [ -n "${APPLE_CERTIFICATE:-}" ] || disable "no APPLE_CERTIFICATE secret is set"

          tmp=$(mktemp -d)
          # openssl rather than base64(1): the decode flag is spelled --decode on GNU
          # and -D on BSD/macOS, and guessing wrong here would report a perfectly good
          # certificate as malformed and quietly ship unsigned.
          printf '%s' "$APPLE_CERTIFICATE" | openssl base64 -d -A > "$tmp/cert.p12" 2>/dev/null \
            || disable "APPLE_CERTIFICATE is not valid base64"
          [ -s "$tmp/cert.p12" ] || disable "APPLE_CERTIFICATE decodes to an empty file"

          # Import into a throwaway keychain: the same operation tauri-action does,
          # so this either proves it works or explains why it will not.
          kc="$tmp/probe.keychain-db"
          security create-keychain -p probe-password "$kc" >/dev/null 2>&1 \
            || disable "could not create a probe keychain"
          # A locked keychain would fail the import for a reason that has nothing to
          # do with the certificate, and this probe must not produce false negatives:
          # wrongly reporting a good certificate as bad would silently ship unsigned.
          security unlock-keychain -p probe-password "$kc" >/dev/null 2>&1 \
            || disable "could not unlock the probe keychain"
          if security import "$tmp/cert.p12" -k "$kc" -P "${APPLE_CERTIFICATE_PASSWORD:-}" \
               -T /usr/bin/codesign >/dev/null 2>&1; then
            echo "Apple certificate imported cleanly; signing enabled."
            echo "signing=true" >> "$GITHUB_OUTPUT"
            # Export the Apple variables into the job environment ONLY here.
            #
            # They cannot be gated in the build step's `env:` block: an expression
            # yielding '' still DEFINES the variable, and the Tauri bundler checks
            # whether APPLE_CERTIFICATE exists rather than whether it is non-empty.
            # An empty-but-defined variable therefore still triggers `security
            # import`, which then fails on nothing — the exact failure this step
            # was written to prevent. Writing them here means that when signing is
            # off, they are genuinely absent.
            for var in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                       APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              value=$(printenv "$var" || true)
              [ -n "$value" ] || continue
              printf '%s<<OSPREY_EOF\n%s\nOSPREY_EOF\n' "$var" "$value" >> "$GITHUB_ENV"
            done
          else
            security delete-keychain "$kc" >/dev/null 2>&1 || true
            disable "APPLE_CERTIFICATE could not be imported (bad PKCS#12, or APPLE_CERTIFICATE_PASSWORD is wrong)"
          fi
          security delete-keychain "$kc" >/dev/null 2>&1 || true
          rm -rf "$tmp"

      - name: Build + sign + release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri updater signing (generate: `npm run tauri signer generate`).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # No APPLE_* entries here on purpose. The probe step exports them into the
          # job environment only when the certificate actually imports; listing them
          # here with a conditional expression would define them as empty strings,
          # and an empty-but-defined APPLE_CERTIFICATE still sends the bundler down
          # the codesign path.
        with:
          projectPath: clients/desktop
          # Publish only on a tag push. Without this guard a manual workflow_dispatch
          # would create a draft release named after the branch ("Osprey main"), so
          # there was no way to exercise this workflow without polluting Releases —
          # which is precisely why nothing here has ever been verified before a tag.
          # With it, workflow_dispatch is a genuine dry run: it builds everything,
          # signs nothing, publishes nothing.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('Osprey {0}', github.ref_name) || '' }}
          releaseDraft: true
          args: ${{ matrix.args }}

  # ---- Backend Docker image ------------------------------------------------ #
  backend-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # A release tags the image with the version and moves :latest. A dry run must
      # do neither — and cannot reuse github.ref_name, because branch names may
      # contain '/', which is not a legal Docker tag ("invalid reference format").
      - name: Decide image tags
        id: img
        shell: bash
        run: |
          set -euo pipefail
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER}/osprey"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            printf 'primary=%s:%s\n' "$repo" "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            printf 'tags<<EOF\n%s:%s\n%s:latest\nEOF\n' \
              "$repo" "$GITHUB_REF_NAME" "$repo" >> "$GITHUB_OUTPUT"
          else
            printf 'primary=%s:dryrun\n' "$repo" >> "$GITHUB_OUTPUT"
            printf 'tags=%s:dryrun\n' "$repo" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v7
        with:
          context: ./backend
          # Same guard as the desktop job. `push: true` on a manual dispatch would
          # publish ghcr.io/.../osprey:main AND overwrite :latest from an untagged
          # commit. On a dry run the image is loaded locally instead, so the SBOM
          # step below still has something real to scan.
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          load: ${{ !startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.img.outputs.tags }}
      - name: SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.img.outputs.primary }}
          format: spdx-json
          output-file: osprey-image-sbom.spdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: image-sbom
          path: osprey-image-sbom.spdx.json
