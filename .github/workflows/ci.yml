name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---- Backend: lint, format, types, tests, coverage ----------------------- #
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install (version-pinned via constraints)
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check osprey tests

      - name: Format check (ruff format)
        run: ruff format --check osprey tests

      - name: Types (mypy)
        run: mypy osprey

      # Branch coverage is on, so this number is stricter than line coverage.
      # Ratchet the floor up as tests land; never lower it to make a PR pass.
      - name: Test + coverage
        run: pytest -q --cov=osprey --cov-report=term-missing --cov-report=xml --cov-fail-under=77

      - name: Upload coverage
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: backend/coverage.xml

  # ---- Migrations + the Postgres/asyncpg path ----------------------------- #
  # The suite runs on SQLite, so this is the only place the production database
  # path is exercised: real Alembic migrations (including the RLS one), real
  # pgvector image, real asyncpg driver, plus a drift check between models and
  # migrations. Blocking — verified green, and it has already caught a broken RLS
  # policy and an unenforced foreign key that SQLite silently accepted.
  postgres:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: osprey
          POSTGRES_PASSWORD: osprey
          POSTGRES_DB: osprey
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U osprey"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      OSPREY_DATABASE_URL: postgresql+asyncpg://osprey:osprey@localhost:5432/osprey
      OSPREY_SECRET_KEY: ci-secret-key-at-least-32-bytes-long-000
      OSPREY_ENCRYPTION_KEY: ci-encryption-key
      OSPREY_WEBHOOK_HMAC_SECRET: ci-hmac-secret
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with prod extras (asyncpg, alembic, pgvector)
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -c constraints.txt -e ".[dev,prod]"

      - name: Enable pgvector extension
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=osprey psql -h localhost -U osprey -d osprey -c 'CREATE EXTENSION IF NOT EXISTS vector;'

      - name: Alembic upgrade head
        run: alembic upgrade head

      - name: Alembic downgrade/upgrade round-trip
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Model/migration drift check
        run: |
          # Autogenerate against the migrated DB; a non-empty diff means the models
          # and migrations have drifted apart.
          alembic check

      - name: Run the suite against Postgres
        run: pytest -q

  # ---- Desktop frontend: typecheck + build -------------------------------- #
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/desktop/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npx vite build

  # ---- Desktop Rust shell: fmt, clippy, build ----------------------------- #
  # Blocking: verified green (fmt + clippy -D warnings + build) as of the run that
  # first compiled this crate in CI. Regressions here should fail the build.
  desktop-rust:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: clients/desktop/src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: Tauri Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: clients/desktop/src-tauri
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      # --locked: build exactly what Cargo.lock pins and fail if it would change,
      # so desktop builds are reproducible and dependency drift is explicit.
      - name: Build
        run: cargo build --locked

  # ---- Helm chart: lint + render ------------------------------------------- #
  # The chart was never validated until now. `helm template` catches template and
  # value errors that only surface at install time otherwise.
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - name: Lint
        run: helm lint deploy/helm
      - name: Render (defaults)
        run: helm template osprey deploy/helm > /tmp/rendered.yaml
      - name: Render (RLS + ingress enabled)
        run: |
          helm template osprey deploy/helm \
            --set config.rlsEnabled=true \
            --set ingress.enabled=true \
            --set-string secrets.secretKey=x --set-string secrets.encryptionKey=y \
            > /tmp/rendered-rls.yaml
      - name: Assert the app and migration jobs use different DB roles
        run: |
          python - <<'PY'
          import re, sys, yaml
          docs = [d for d in yaml.safe_load_all(open("/tmp/rendered.yaml")) if d]
          by_kind = {}
          for d in docs:
              name = d["metadata"]["name"]
              by_kind[(d["kind"], name)] = d

          def db_key(doc):
              spec = doc["spec"]["template"]["spec"]["containers"][0]
              for env in spec["env"]:
                  if env["name"] == "OSPREY_DATABASE_URL":
                      return env["valueFrom"]["secretKeyRef"]["key"]
              return None

          api = next(v for (k, n), v in by_kind.items() if k == "Deployment" and n.endswith("-api"))
          job = next(v for (k, n), v in by_kind.items() if k == "Job")
          assert db_key(api) == "databaseUrl", db_key(api)
          assert db_key(job) == "migrationDatabaseUrl", db_key(job)
          print("OK: api uses the app role, migrations use the owner role")
          PY

  # ---- Deploy smoke test on a real cluster --------------------------------- #
  # Rendering the chart proves the templates are valid; it cannot prove the thing
  # actually runs. This installs into a kind cluster with RLS enabled and asserts
  # the migration hook completes, the pods become ready, and the app reports that
  # tenant isolation is genuinely enforced. Blocking — verified green, and it has
  # already caught a chart hook-ordering bug and an RLS policy that made signup
  # impossible, neither of which any offline check could see.
  deploy-smoke:
    runs-on: ubuntu-latest
    # Network-heavy and blocking: cap it so a stalled kind setup or image pull fails
    # in minutes instead of holding a PR un-mergeable for the 6-hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with:
          cluster_name: osprey-ci

      - name: Build the backend image and load it into the cluster
        run: |
          docker build -t osprey:ci ./backend
          kind load docker-image osprey:ci --name osprey-ci

      - name: Deploy Postgres (pgvector) + Redis
        run: |
          kubectl apply -f deploy/ci/postgres-redis.yaml
          kubectl rollout status deploy/osprey-postgres --timeout=180s
          kubectl rollout status deploy/osprey-redis --timeout=120s

      - name: Install the chart (RLS enabled, app role for runtime)
        run: |
          helm install osprey deploy/helm --wait --timeout 5m \
            --set image.repository=osprey --set image.tag=ci \
            --set image.pullPolicy=Never \
            --set config.env=prod --set config.rlsEnabled=true \
            --set replicaCount.api=1 --set replicaCount.worker=1 \
            --set-string secrets.secretKey=ci-secret-key-at-least-32-bytes-long-0 \
            --set-string secrets.encryptionKey=ci-encryption-key \
            --set-string secrets.webhookHmacSecret=ci-hmac-secret \
            --set-string secrets.databaseUrl='postgresql+asyncpg://osprey_app:osprey_app@osprey-postgres:5432/osprey' \
            --set-string secrets.migrationDatabaseUrl='postgresql+asyncpg://osprey:osprey@osprey-postgres:5432/osprey' \
            --set-string secrets.redisUrl='redis://osprey-redis:6379/0'

      - name: Migration hook ran and the schema exists
        run: |
          kubectl get jobs
          TABLES=$(kubectl exec deploy/osprey-postgres -- psql -U osprey -d osprey -tAc \
            "SELECT count(*) FROM information_schema.tables WHERE table_schema='public'")
          echo "public tables: $TABLES"
          test "$TABLES" -gt 10

      - name: API is healthy and reports RLS as ENFORCED
        run: |
          kubectl rollout status deploy/osprey-osprey-api --timeout=180s
          kubectl port-forward svc/osprey-osprey-api 8000:8000 &
          # Wait for the forward to be usable rather than guessing with a sleep —
          # a slow or dropped forward must not fail an unrelated PR.
          for i in $(seq 1 45); do
            curl -fsS --max-time 3 http://localhost:8000/health >/dev/null 2>&1 && break
            if [ "$i" = 45 ]; then echo "port-forward never became usable"; exit 1; fi
            sleep 2
          done
          curl -fsS http://localhost:8000/health | tee /dev/stderr | grep -q '"status":"ok"'
          curl -fsS http://localhost:8000/ready  | tee /dev/stderr | grep -q '"ready":true'
          # Register an owner, then ask the admin endpoint whether isolation is real.
          TOKEN=$(curl -fsS -X POST http://localhost:8000/auth/register \
            -H 'content-type: application/json' \
            -d '{"email":"ci@example.com","password":"password123","org_name":"CI"}' \
            | python -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')
          ISO=$(curl -fsS http://localhost:8000/admin/security/tenant-isolation \
            -H "authorization: Bearer $TOKEN")
          echo "$ISO"
          echo "$ISO" | grep -q '"enforced":true'

      # The endpoint above only proves the runtime ROLE cannot bypass RLS. These two
      # checks prove the policies themselves exist and actually filter, so a future
      # tenant table shipped without a policy cannot pass green.
      - name: Every tenant table carries a policy
        run: |
          MISSING=$(kubectl exec deploy/osprey-postgres -- psql -U osprey -d osprey -tAc "
            SELECT COALESCE(string_agg(t, ','), '') FROM (
              SELECT unnest(ARRAY['org','membership','project','connection','ai_connection',
                                  'script_task','device','audit_log','signal','item','score',
                                  'action','hotlist_snapshot']) AS t
            ) x
            WHERE NOT EXISTS (SELECT 1 FROM pg_policies p
                              WHERE p.schemaname='public' AND p.tablename = x.t)")
          echo "tables without an RLS policy: '${MISSING}'"
          test -z "$MISSING"

      - name: Policies actually filter rows for the app role
        run: |
          # Registration created exactly one org. Reading as the app role while
          # scoped to a different tenant must return zero rows.
          VISIBLE=$(kubectl exec deploy/osprey-postgres -- psql -U osprey -d osprey -tAc "
            BEGIN;
            SET LOCAL ROLE osprey_app;
            SELECT set_config('osprey.current_org', 'some-other-tenant', true);
            SELECT count(*) FROM org;
            COMMIT;" | tail -1)
          TOTAL=$(kubectl exec deploy/osprey-postgres -- psql -U osprey -d osprey -tAc \
            "SELECT count(*) FROM org")
          echo "orgs visible to a foreign tenant: $VISIBLE (of $TOTAL total)"
          test "$TOTAL" -ge 1
          test "$VISIBLE" = "0"

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get pods,jobs -o wide
          kubectl describe pods | tail -80
          kubectl logs -l app.kubernetes.io/component=api --tail=120 || true
          kubectl logs -l app.kubernetes.io/component=worker --tail=60 || true
          kubectl logs job/osprey-osprey-migrate --tail=80 || true

  # ---- Supply chain: SBOM, vuln scans -------------------------------------- #
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          path: ./backend
          format: spdx-json
          output-file: osprey-sbom.spdx.json

      # Blocking as of the triage that cleared every finding: setuptools was on
      # 65.5.0 (7 CVEs -> build-system now requires >=83) and the desktop tree had
      # sharp<0.35 (libvips CVEs) plus vite<=6.4.2/esbuild. If a new advisory lands,
      # fix it or add a documented, dated exception — don't silently downgrade this.
      - name: Python dependency audit (pip-audit)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip setuptools wheel pip-audit
          pip install -c constraints.txt -e "."
          pip-audit --progress-spinner off

      - name: npm audit (desktop)
        working-directory: clients/desktop
        run: npm audit --audit-level=high

      # Trivy stays advisory: it also reports OS-package CVEs from the python base
      # image that we cannot fix from this repo (only by rebasing the image). Treat
      # its output as a signal to bump the base image, not as a merge blocker.
      - name: Filesystem scan (Trivy)
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy fs --severity HIGH,CRITICAL --exit-code 0 --no-progress ./backend

      - name: Build image and scan it
        run: |
          docker build -t osprey:ci ./backend
          trivy image --severity HIGH,CRITICAL --exit-code 0 --no-progress osprey:ci

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: osprey-sbom.spdx.json
