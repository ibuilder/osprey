version: 2
updates:
  # Backend Python deps. Grouped so routine bumps arrive as one reviewable PR;
  # majors stay separate because they need a deliberate test run (see the caps in
  # pyproject.toml) and constraints.txt must be regenerated alongside them.
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      backend-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels: ["dependencies", "backend"]

  # Desktop frontend.
  - package-ecosystem: npm
    directory: /clients/desktop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # React and its types must move together — a piecemeal bump breaks peer
      # resolution (@types/react-dom@N requires @types/react@^N), which is exactly
      # how the first attempt failed. Grouping them (majors included) means one
      # coherent PR instead of four mutually incompatible ones.
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      frontend-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels: ["dependencies", "desktop"]

  # Desktop Rust shell.
  - package-ecosystem: cargo
    directory: /clients/desktop/src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels: ["dependencies", "desktop"]

  # Pin drift in the workflows themselves.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: ["dependencies", "ci"]
