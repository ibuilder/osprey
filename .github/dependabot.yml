version: 2
updates:
  # Backend Python deps.
  #
  # Dependabot edits `backend/constraints.txt` (it discovers the file and treats
  # it as a manifest); it does not touch pyproject.toml, whose floors and caps are
  # set deliberately. There is a SECOND pin file it cannot reason about:
  # `constraints-prod.txt` pins the runtime extras — asyncpg, arq, alembic, the AI
  # SDKs, push, OTel — that the test suite never installs but the Docker image
  # does. The two are applied together and Dependabot resolves each in isolation,
  # so a bump can be individually valid and jointly unresolvable.
  #
  # That is deliberately caught rather than prevented: CI's "Production
  # constraints cover every extra the image installs" step dry-run resolves both
  # files together, so such a PR goes red instead of shipping an image whose
  # dependencies were never resolved as a set. Fix one with:
  #
  #     python backend/tools/regen_constraints.py
  #
  # Grouped so routine bumps arrive as one reviewable PR; majors stay separate
  # because they need a deliberate test run (see the caps in pyproject.toml).
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # pydantic pins pydantic-core to an exact version, so a standalone bump of it
    # can never resolve:
    #
    #     pydantic 2.13.4 depends on pydantic-core==2.46.4
    #     The user requested (constraint) pydantic-core==2.48.0
    #     ERROR: ResolutionImpossible
    #
    # Dependabot has produced that unmergeable PR twice (#14, #30), so it is
    # ignored. The cost runs the other way: pydantic-core then never moves at all,
    # so a pydantic bump fails CI on install with the mirror-image error (#51,
    # "pydantic 2.13.5 depends on pydantic-core==2.46.5"). When that happens, bump
    # pydantic-core in constraints.txt to the version pydantic names, on the same
    # PR. No ignore rule avoids both failures; this one fails loudly and is a
    # one-line fix.
    #
    # redis is capped by arq (0.28.0 requires redis<6), so a major bump of it can
    # only be jointly unresolvable (#57 proposed 8.1.0). Lift this when arq does.
    ignore:
      - dependency-name: "pydantic-core"
      - dependency-name: "redis"
        versions: [">=6"]
    groups:
      backend-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels: ["dependencies", "backend"]

  # Desktop frontend.
  - package-ecosystem: npm
    directory: /clients/desktop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # React and its types must move together — a piecemeal bump breaks peer
      # resolution (@types/react-dom@N requires @types/react@^N), which is exactly
      # how the first attempt failed. Grouping them (majors included) means one
      # coherent PR instead of four mutually incompatible ones.
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      # Same failure shape: @vitest/coverage-v8 peers on the exact vitest version,
      # so separate majors (#54, #55) each fail `npm ci` with ERESOLVE.
      vitest:
        patterns: ["vitest", "@vitest/*"]
      frontend-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels: ["dependencies", "desktop"]

  # Desktop Rust shell.
  - package-ecosystem: cargo
    directory: /clients/desktop/src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      # The tauri crates are released as a set and their versions are coupled;
      # bumping one alone is how you get a build that no longer compiles against
      # the generated context. Everything else batches by minor/patch.
      tauri:
        patterns: ["tauri", "tauri-*"]
      rust-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels: ["dependencies", "desktop"]

  # Container base image.
  #
  # Previously unwatched, which left a gap the pipeline could see but not close:
  # Trivy reports base-image CVEs and its own comment in ci.yml says to treat them
  # as "a signal to bump the base image" — while nothing ever proposed that bump.
  # `python:3.12-slim` appears twice (builder + runtime) and Dependabot moves both.
  #
  # docker-compose.yml is deliberately NOT watched: its postgres/redis pins are
  # local-dev infrastructure, and production points at managed services through
  # the Helm values instead. The Helm `image.tag` is Osprey's own release tag,
  # which the release workflow owns.
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    # Patch-level image updates (3.12.x) are exactly what this entry is for. A new
    # Python minor is not: CI tests 3.11-3.13 and constraints-prod.txt is resolved
    # for the 3.12 image, so moving the image needs CI coverage and regenerated
    # pins first (#45 proposed 3.14 and was closed). Raise this with that work.
    ignore:
      - dependency-name: "python"
        versions: [">=3.13"]
    labels: ["dependencies", "docker", "security"]

  # Pin drift in the workflows themselves.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Action majors are usually just a runner/node bump and are verified the
      # same way regardless, so they group too. Six separate single-action PRs
      # (#1, #4, #21, #22, #24, #25) is review noise, not review.
      actions:
        patterns: ["*"]
    labels: ["dependencies", "ci"]
